<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Stellar Colonization – Local Ccloud</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; color: white; font-family: Arial, sans-serif; }
        #timer {
            position: absolute; top: 20px; left: 20px; color: white; font-size: 18px;
            background-color: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px;
            border: 1px solid #444; z-index: 1000;
        }
        #info-panel {
            position: absolute; top: 20px; right: 20px; color: white; font-size: 14px;
            background-color: rgba(0,0,0,0.7); padding: 12px 20px; border-radius: 8px;
            border: 1px solid #444; z-index: 1000; min-width: 200px;
            pointer-events: none; backdrop-filter: blur(5px);
            transition: opacity 0.2s;
        }
        #info-panel.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #info-panel h3 {
            margin: 0 0 8px 0; color: #ffaa66; font-size: 16px; border-bottom: 1px solid #555;
        }
        #info-panel p { margin: 4px 0; }
        .info-value { color: #88ccff; font-weight: bold; }
        #toggle-info {
            position: absolute; top: 20px; right: 20px; z-index: 1001;
            background-color: rgba(0,0,0,0.7); color: white; border: 1px solid #444;
            border-radius: 30px; padding: 8px 16px; font-size: 14px; cursor: pointer;
            backdrop-filter: blur(5px); transition: 0.2s;
        }
        #toggle-info:hover { background-color: rgba(50,50,50,0.9); }
        #bottom-area {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center; z-index: 1000;
            pointer-events: none;
        }
        #controls {
            display: flex; gap: 15px; align-items: center;
            background-color: rgba(20,20,20,0.8); padding: 10px 20px; border-radius: 40px;
            backdrop-filter: blur(5px); border: 1px solid #444;
            pointer-events: auto;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 24px; font-size: 16px; font-weight: bold;
            background-color: #2a2a2a; color: white; border: 1px solid #555;
            border-radius: 30px; cursor: pointer; transition: 0.2s;
            min-width: 120px;
            pointer-events: auto;
        }
        button:hover { background-color: #3a3a3a; border-color: #888; }
        #start-pause-btn { background-color: #1e4a2e; border-color: #2e8b57; }
        #start-pause-btn:hover { background-color: #2e8b57; }
        #journey-log {
            width: 600px; max-width: 90vw; max-height: 150px;
            background-color: rgba(0,0,0,0.6); border: 1px solid #444; border-radius: 8px;
            padding: 8px; color: #ccc; font-size: 11px; z-index: 1000;
            overflow-y: auto; backdrop-filter: blur(4px);
            pointer-events: auto;
            margin-top: 5px;
        }
        #journey-log h3 {
            margin: 0 0 5px 0; color: #fff; font-size: 12px; text-align: center;
            border-bottom: 1px solid #555; padding-bottom: 3px;
        }
        .log-entry {
            margin-bottom: 3px; padding: 2px 4px; background-color: rgba(255,255,255,0.05);
            border-left: 3px solid #2e8b57; border-radius: 2px;
            font-family: monospace; font-size: 10px;
        }
        .log-entry .dist { color: #ffaa66; }
        .log-entry .time { color: #66ccff; }
    </style>
</head>

        // ============================================================
        // VMAG to color function
        // ============================================================
        function vmagToColor(vmag) {
            if (vmag === undefined || vmag === null) return 0xffffff;
            if (vmag < 2) {
                const t = Math.max(0, Math.min(1, (vmag + 1) / 3));
                return new THREE.Color().lerpColors(
                    new THREE.Color(0xaaccff),
                    new THREE.Color(0xffffee),
                    t
                ).getHex();
            } else if (vmag < 6) {
                const t = (vmag - 2) / 4;
                return new THREE.Color().lerpColors(
                    new THREE.Color(0xffdd88),
                    new THREE.Color(0xffaa66),
                    t
                ).getHex();
            } else if (vmag < 10) {
                const t = (vmag - 6) / 4;
                return new THREE.Color().lerpColors(
                    new THREE.Color(0xffaa66),
                    new THREE.Color(0xff8866),
                    t
                ).getHex();
            } else if (vmag < 16) {
                const t = (vmag - 10) / 6;
                return new THREE.Color().lerpColors(
                    new THREE.Color(0xff8866),
                    new THREE.Color(0xcc5555),
                    t
                ).getHex();
            } else {
                return 0xaa8866;
            }
        }

        // ============================================================
        // Three.js setup
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);
        controls.update();

        // ----- LIGHTING (straight down the Y axis) -----
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 0, 0);   // light from above (positive Y)
        scene.add(dirLight);


// ============================================================
// CORRECT MILKYWAY BACKGROUND ORIENTATION (fixed mirroring)
// ============================================================
const bgRotY = 0.0;      // adjust rotation if needed (0, 1.57, 3.14)
const bgRotX = 1.57;      // tilt

const bgGeometry = new THREE.SphereGeometry(400, 64, 40);
const textureLoader = new THREE.TextureLoader();
textureLoader.load('https://cdn.eso.org/images/screen/eso0932a.jpg', (texture) => {
    // Flip the texture horizontally to correct mirroring
    texture.wrapS = THREE.RepeatWrapping;
    texture.repeat.x = -1;
    texture.offset.x = 1;
    
    const bgMaterial = new THREE.MeshBasicMaterial({
        side: THREE.BackSide,
        map: texture
    });
    const backgroundSphere = new THREE.Mesh(bgGeometry, bgMaterial);
    backgroundSphere.rotation.y = bgRotY;
    backgroundSphere.rotation.x = bgRotX;
    scene.add(backgroundSphere);
    console.log('Background loaded and flipped');
}, undefined, (err) => {
    console.error('Background failed to load, using fallback color', err);
    scene.background = new THREE.Color(0x050510);

});



        // ============================================================
        // Local cloud image – centered at the Sun (0,0,0) in galactic plane
        // --- ADJUST THESE TWO VALUES TO YOUR PREFERENCE ---
        const cloudSize = 55;          // diameter in light‑years (try 40–60)
        const cloudOpacity = 0.3;      // 0 = invisible, 1 = fully opaque
        // ============================================================
        const imageUrl = 'https://i.ibb.co/677QPyj6/localcloud.jpg';
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.src = imageUrl;
        img.onload = function() {
            console.log(`✅ Image loaded: ${img.width} x ${img.height}`);
            let planeWidth, planeHeight;
            if (img.width >= img.height) {
                planeWidth = cloudSize;
                planeHeight = cloudSize * (img.height / img.width);
            } else {
                planeHeight = cloudSize;
                planeWidth = cloudSize * (img.width / img.height);
            }
            const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
            const textureLoader = new THREE.TextureLoader();
            textureLoader.crossOrigin = '';
            textureLoader.load(imageUrl, (texture) => {
                const material = new THREE.MeshBasicMaterial({
                    map: texture,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: cloudOpacity
                });
                const plane = new THREE.Mesh(geometry, material);
                // Position at origin, default orientation faces +Z, which lies in XY plane (galactic plane)
                plane.position.set(0, 0, 0);
                scene.add(plane);
                console.log(`✅ Local cloud plane added (size ${cloudSize} ly, opacity ${cloudOpacity})`);
            });
        };
        img.onerror = () => {
            console.error('❌ Failed to load image');
        };

        // ============================================================
        // Create stars and bright green orbit rings for habitable stars
        // Store meshes and labels for interaction
        // ============================================================
        const STAR_RADIUS = 0.07;
        const systemPositions = []; // store position for each system
        const starMeshes = []; // for raycasting
        const starLabels = []; // CSS2D objects for each system

        systems.forEach((sys, idx) => {
            const colorHex = vmagToColor(sys.vmag);

            // Star sphere
            const geo = new THREE.SphereGeometry(STAR_RADIUS, 24, 12);
            const mat = new THREE.MeshStandardMaterial({
                color: colorHex,
                emissive: 0x222222
            });
            const sphere = new THREE.Mesh(geo, mat);
            sphere.position.set(sys.x, sys.y, sys.z);
            sphere.userData = { systemIndex: idx };
            scene.add(sphere);
            starMeshes.push(sphere);

            systemPositions[idx] = new THREE.Vector3(sys.x, sys.y, sys.z);

            // If habitable, add two bright green rings
            if (sys.habitable) {
                const ringRadius1 = 0.15;
                const ringRadius2 = 0.25;
                const tubeRadius = 0.003;
                const ringGeo1 = new THREE.TorusGeometry(ringRadius1, tubeRadius, 8, 48);
                const ringGeo2 = new THREE.TorusGeometry(ringRadius2, tubeRadius, 8, 48);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0x00ff00,
                    emissive: 0x004400,
                    transparent: true,
                    opacity: 0.7
                });
                const ring1 = new THREE.Mesh(ringGeo1, ringMat);
                const ring2 = new THREE.Mesh(ringGeo2, ringMat);
                ring1.rotation.x = Math.PI / 2;
                ring2.rotation.x = Math.PI / 2;
                ring1.position.set(sys.x, sys.y, sys.z);
                ring2.position.set(sys.x, sys.y, sys.z);
                scene.add(ring1);
                scene.add(ring2);
            }

            // Label – initially invisible
            const div = document.createElement('div');
            div.textContent = sys.name;
            div.style.color = 'rgba(255,255,255,0.9)';
            div.style.fontSize = '10px';
            div.style.fontWeight = '300';
            div.style.textShadow = '1px 1px 2px black';
            div.style.background = 'none';
            div.style.padding = '0';
            div.style.pointerEvents = 'none';
            div.style.whiteSpace = 'nowrap';
            div.style.opacity = '0';
            div.style.transition = 'opacity 0.2s';
            const label = new CSS2DObject(div);
            label.position.set(sys.x, sys.y + 0.35, sys.z);
            scene.add(label);
            starLabels[idx] = label;
        });

        // ============================================================
        // Interaction: tap/click and double-tap/double-click
        // ============================================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let lastTapTime = 0;
        const doubleTapDelay = 300;

        function handleInteraction(event) {
            event.preventDefault();

            const currentTime = performance.now();
            const isDouble = (currentTime - lastTapTime) < doubleTapDelay;
            lastTapTime = currentTime;

            const rect = renderer.domElement.getBoundingClientRect();
            let clientX, clientY;
            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(starMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const sysIdx = hit.userData.systemIndex;
                const sys = systems[sysIdx];
                const pos = systemPositions[sysIdx];
                const distFromSun = pos.length().toFixed(2);

                if (isDouble) {
                    // Double-tap: center camera on star
                    controls.target.copy(pos);
                    controls.update();
                } else {
                    // Single tap: show info and label
                    const panel = document.getElementById('info-panel');
                    panel.innerHTML = `
                        <h3>${sys.name}</h3>
                        <p>Distance from Sun: <span class="info-value">${distFromSun} ly</span></p>
                        <p>Coordinates: <span class="info-value">(${sys.x.toFixed(2)}, ${sys.y.toFixed(2)}, ${sys.z.toFixed(2)})</span></p>
                        <p>Habitable: <span class="info-value">${sys.habitable ? 'Yes' : 'No'}</span></p>
                        <p>VMAG: <span class="info-value">${sys.vmag}</span></p>
                    `;

                    // Hide all labels
                    starLabels.forEach(label => { label.element.style.opacity = '0'; });
                    // Show this star's label
                    starLabels[sysIdx].element.style.opacity = '1';
                }
            }
        }

        renderer.domElement.addEventListener('click', handleInteraction);
        renderer.domElement.addEventListener('touchstart', handleInteraction, { passive: false });

        // Toggle info panel
        document.getElementById('toggle-info').addEventListener('click', () => {
            const panel = document.getElementById('info-panel');
            const btn = document.getElementById('toggle-info');
            panel.classList.toggle('hidden');
            btn.textContent = panel.classList.contains('hidden') ? 'Show Info' : 'Hide Info';
        });

        // ============================================================
        // Simulation constants and ship logic
        // ============================================================
        const SHIP_SPEED = 0.2;
        const MAX_JUMP_DIST = 7.5;
        const TIME_PER_FRAME = 0.1;

        let simTime = 0;
        let reachedSystemIndices = new Set([0]); // Sun is system 0
        let lines = [];

        function distanceBetweenSystems(idx1, idx2) {
            const p1 = systemPositions[idx1];
            const p2 = systemPositions[idx2];
            if (!p1 || !p2) return Infinity;
            return p1.distanceTo(p2);
        }

        function createShip(srcIdx, destIdx, launchTime) {
            const srcPos = systemPositions[srcIdx];
            const destPos = systemPositions[destIdx];
            if (!srcPos || !destPos) return;

            const points = [
                new THREE.Vector3(srcPos.x, srcPos.y, srcPos.z),
                new THREE.Vector3(srcPos.x, srcPos.y, srcPos.z)
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xffff00 });
            const lineObj = new THREE.Line(geometry, material);
            scene.add(lineObj);

            const ship = {
                line: lineObj,
                srcIdx,
                destIdx,
                startTime: launchTime,
                travelTime: distanceBetweenSystems(srcIdx, destIdx) / SHIP_SPEED,
                progress: 0,
                isComplete: false,
                isFirstConnection: false
            };
            lines.push(ship);
            return ship;
        }

        function addLogEntry(srcName, destName, distance, travelYears) {
            const logDiv = document.getElementById('log-entries');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span style="color:#fff;">${srcName} → ${destName}</span> <span class="dist">${distance.toFixed(2)} ly</span> <span class="time">${travelYears.toFixed(1)} yr</span>`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateShips() {
            for (let i = lines.length - 1; i >= 0; i--) {
                const ship = lines[i];
                if (ship.isComplete) continue;

                const elapsed = simTime - ship.startTime;
                let progress = elapsed / ship.travelTime;
                if (progress >= 1) {
                    progress = 1;
                    ship.isComplete = true;
                    ship.progress = 1;

                    const destIdx = ship.destIdx;
                    const isFirst = !reachedSystemIndices.has(destIdx);
                    ship.isFirstConnection = isFirst;

                    const srcName = systems[ship.srcIdx].name;
                    const destName = systems[destIdx].name;
                    const distance = distanceBetweenSystems(ship.srcIdx, destIdx);
                    addLogEntry(srcName, destName, distance, ship.travelTime);

                    if (isFirst) {
                        ship.line.material.color.setHex(0x00ff00);
                        reachedSystemIndices.add(destIdx);
                        launchFrom(destIdx, simTime);
                    } else {
                        ship.line.material.color.setHex(0xc0c0c0);
                    }

                    const srcPos = systemPositions[ship.srcIdx];
                    const destPos = systemPositions[ship.destIdx];
                    if (srcPos && destPos) {
                        const points = [
                            new THREE.Vector3(srcPos.x, srcPos.y, srcPos.z),
                            new THREE.Vector3(destPos.x, destPos.y, destPos.z)
                        ];
                        ship.line.geometry.dispose();
                        ship.line.geometry = new THREE.BufferGeometry().setFromPoints(points);
                    }
                } else {
                    ship.progress = progress;
                    const srcPos = systemPositions[ship.srcIdx];
                    const destPos = systemPositions[ship.destIdx];
                    if (srcPos && destPos) {
                        const currentEnd = new THREE.Vector3().lerpVectors(
                            srcPos.clone(),
                            destPos.clone(),
                            progress
                        );
                        const points = [
                            new THREE.Vector3(srcPos.x, srcPos.y, srcPos.z),
                            currentEnd
                        ];
                        ship.line.geometry.dispose();
                        ship.line.geometry = new THREE.BufferGeometry().setFromPoints(points);
                    }
                }
            }
        }

        function launchFrom(srcIdx, launchTime) {
            for (let destIdx = 0; destIdx < systems.length; destIdx++) {
                if (destIdx === srcIdx) continue;
                if (reachedSystemIndices.has(destIdx)) continue;
                const d = distanceBetweenSystems(srcIdx, destIdx);
                if (d > MAX_JUMP_DIST) continue;
                if (lines.some(s => s.srcIdx === srcIdx && s.destIdx === destIdx)) continue;
                createShip(srcIdx, destIdx, launchTime);
            }
        }

        launchFrom(0, 0);

        // ============================================================
        // Animation loop
        // ============================================================
        let isPaused = true;
        let isComplete = false;
        let animationId;

        function animate() {
            if (!isPaused) {
                simTime += TIME_PER_FRAME;
                updateShips();
                document.getElementById('timer').innerText = `Elapsed: ${Math.round(simTime)} years @0.2c Delta V`;

                if (lines.length > 0 && lines.every(s => s.isComplete)) {
                    isPaused = true;
                    isComplete = true;
                    document.getElementById('start-pause-btn').innerText = 'Restart';
                }
            }

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            animationId = requestAnimationFrame(animate);
        }
        animate();

        // ============================================================
        // Event handlers
        // ============================================================
        document.getElementById('start-pause-btn').addEventListener('click', () => {
            if (isComplete) {
                simTime = 0;
                reachedSystemIndices.clear();
                reachedSystemIndices.add(0);
                lines.forEach(s => scene.remove(s.line));
                lines = [];
                launchFrom(0, 0);
                document.getElementById('timer').innerText = 'Elapsed: 0 years';
                document.getElementById('log-entries').innerHTML = '';
                isComplete = false;
                isPaused = true;
                document.getElementById('start-pause-btn').innerText = 'Start';
            } else if (isPaused) {
                isPaused = false;
                document.getElementById('start-pause-btn').innerText = 'Pause';
            } else {
                isPaused = true;
                document.getElementById('start-pause-btn').innerText = 'Resume';
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
